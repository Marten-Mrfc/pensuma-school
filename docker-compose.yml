# Local development database:   docker compose up -d db
# Full stack (like Dokploy):     docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pensuma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pensuma}
      POSTGRES_DB: pensuma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pensuma -d pensuma"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pensuma:${POSTGRES_PASSWORD:-pensuma}@db:5432/pensuma
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (min. 32 tekens)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GRADER_POOL_SIZE: ${GRADER_POOL_SIZE:-2}
      GRADER_MAX_CONCURRENCY: ${GRADER_MAX_CONCURRENCY:-4}
    ports:
      - "3000:3000"

volumes:
  pgdata:
